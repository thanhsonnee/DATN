spring:
  application:
    name: gym-backend

  datasource:
    # Cổng 5434: container postgres của dự án. Cổng 5432/5433 là PostgreSQL 16/17 cài sẵn trên máy.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/gymdb}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:gym_dev_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      # KHÔNG BAO GIỜ để 'update' — Flyway là nguồn sự thật duy nhất của schema
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    # Giữ nguyên trường null trong JSON: hợp đồng API ổn định, và TypeScript sinh
    # từ OpenAPI phân biệt được "không có trường" với "trường có giá trị rỗng".
    default-property-inclusion: always
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

# ---- Cấu hình riêng của ứng dụng ----
app:
  jwt:
    secret: ${JWT_SECRET:doi-chuoi-nay-truoc-khi-trien-khai-that-toi-thieu-32-ky-tu}
    access-token-ttl: PT15M      # 15 phút
    refresh-token-ttl: P30D      # 30 ngày
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:gymadmin}
    secret-key: ${MINIO_SECRET_KEY:gym_dev_password}
    bucket: ${MINIO_BUCKET:gym-private}
    presigned-url-ttl: PT5M      # 5 phút

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.gym: DEBUG
    org.flywaydb: INFO

---
# Hồ sơ dùng khi chạy trong Docker
spring:
  config:
    activate:
      on-profile: docker
logging:
  level:
    com.gym: INFO
